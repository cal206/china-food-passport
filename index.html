<script>

const F = [{"city": "Beijing", "name": "Peking duck", "cn": "北京烤鸭", "desc": "Roast duck with lacquered, crisp skin and tender meat, usually carved tableside and wrapped in thin pancakes with spring onion, cucumber and sweet bean sauce.", "tip": "Book one proper duck meal; for two people, half a duck is often enough."}, {"city": "Beijing", "name": "Zhajiangmian", "cn": "炸酱面", "desc": "Thick wheat noodles topped with a savoury fried soybean-and-pork sauce, then mixed with fresh shredded vegetables. It is one of Beijing's classic everyday noodle dishes.", "tip": "A great casual lunch; mix everything thoroughly before eating."}, {"city": "Beijing", "name": "Jianbing", "cn": "煎饼", "desc": "A hot savoury breakfast crepe cooked on a griddle with egg, herbs and sauce, usually folded around a crisp cracker for crunch.", "tip": "Best from a busy breakfast stall in the morning."}, {"city": "Beijing", "name": "Copper-pot mutton hotpot", "cn": "涮羊肉", "desc": "Paper-thin slices of lamb are quickly swished in a light broth inside a traditional copper pot, then dipped in a rich sesame-based sauce.", "tip": "Very different from Sichuan hotpot: lighter, lamb-focused and traditionally Beijing."}, {"city": "Beijing", "name": "Jiaozi dumplings", "cn": "饺子", "desc": "Boiled or steamed dumplings filled with combinations such as pork, chive, cabbage, lamb or vegetables, usually eaten with vinegar and garlic.", "tip": "Order several fillings to share."}, {"city": "Beijing", "name": "Douzhi", "cn": "豆汁", "desc": "A traditional fermented mung-bean drink with a strong sour, funky flavour. It is one of Beijing's most notorious local tastes and is often served with fried dough rings.", "tip": "Try a small serving for the experience; this is very much a love-it-or-hate-it food."}, {"city": "Xi'an", "name": "Biang Biang noodles", "cn": "油泼扯面 / Biángbiáng面", "desc": "Very wide, hand-pulled wheat noodles dressed with chilli, garlic, vinegar and hot oil. Chewy, aromatic and one of Shaanxi's signature dishes.", "tip": "One of the highest-priority foods on the whole trip."}, {"city": "Xi'an", "name": "Roujiamo", "cn": "肉夹馍", "desc": "A crisp, dense flatbread split and stuffed with finely chopped slow-braised meat. Often described as a Chinese hamburger, but with a much older history.", "tip": "Perfect as a snack while exploring the city."}, {"city": "Xi'an", "name": "Yangrou paomo", "cn": "羊肉泡馍", "desc": "A deeply savoury lamb or mutton broth served with small pieces of dense flatbread. Traditionally, diners tear the bread into tiny pieces before the kitchen adds the soup.", "tip": "Give yourself time for the bread-tearing ritual; it is part of the experience."}, {"city": "Xi'an", "name": "Liangpi", "cn": "凉皮", "desc": "Cool, springy wheat or rice noodles dressed with chilli oil, vinegar, garlic, sesame and often cucumber or bean sprouts.", "tip": "Especially good as a light lunch alongside roujiamo."}, {"city": "Xi'an", "name": "Local dumplings", "cn": "饺子 / 饺子宴", "desc": "Xi'an has a strong dumpling tradition, from simple boiled dumplings to elaborate dumpling banquets with many shapes and fillings.", "tip": "A dumpling banquet is fun, but a small local shop is often better value."}, {"city": "Xi'an", "name": "Persimmon cake", "cn": "柿子饼", "desc": "A sweet Shaanxi snack made from persimmon dough, often filled with ingredients such as nuts or sesame and pan-fried until soft and fragrant.", "tip": "Look for freshly cooked ones around the old city rather than packaged versions."}, {"city": "Chengdu", "name": "Sichuan hotpot", "cn": "四川火锅", "desc": "A bubbling communal pot flavoured with dried chillies, Sichuan peppercorns and aromatics. Ingredients are cooked at the table and dipped into a personal sauce.", "tip": "Choose a split pot or mild spice level if you want to enjoy more than just the heat."}, {"city": "Chengdu", "name": "Mapo tofu", "cn": "麻婆豆腐", "desc": "Silky tofu in a glossy sauce of minced meat, fermented bean paste, chilli and Sichuan pepper. A proper Chengdu version balances heat, salt, richness and numbing pepper.", "tip": "Eat it with plain rice so you can appreciate the sauce."}, {"city": "Chengdu", "name": "Dan Dan noodles", "cn": "担担面", "desc": "A small bowl of noodles tossed with chilli oil, Sichuan pepper, preserved vegetables, sesame or peanut notes and often minced pork.", "tip": "Usually a snack-sized portion, so it is easy to combine with other dishes."}, {"city": "Chengdu", "name": "Chuan Chuan", "cn": "串串香", "desc": "A huge selection of meats, tofu, mushrooms and vegetables served on skewers and cooked in a spicy communal broth.", "tip": "Pick a few unfamiliar skewers as well as safe favourites; you normally pay by counting sticks."}, {"city": "Chengdu", "name": "Zhong dumplings", "cn": "钟水饺", "desc": "Soft pork dumplings dressed in a glossy sauce that combines chilli oil, garlic and a slightly sweet seasoned soy sauce.", "tip": "A good choice at a traditional Chengdu snack restaurant."}, {"city": "Chengdu", "name": "Sweet-water noodles", "cn": "甜水面", "desc": "Thick, chewy noodles coated in a sweet-savoury-spicy sauce with sesame, chilli and aromatic soy flavours.", "tip": "The texture is the star; order a small bowl as part of a snack crawl."}, {"city": "Chengdu", "name": "Rabbit head", "cn": "兔头", "desc": "A famous Chengdu snack of rabbit head braised and coated in intense chilli and Sichuan pepper seasoning. Diners pick the meat carefully from around the bone.", "tip": "Definitely optional, but one of the city's most distinctive food experiences."}, {"city": "Chongqing", "name": "Chongqing hotpot", "cn": "重庆火锅", "desc": "An intense beef-tallow hotpot packed with dried chilli and Sichuan pepper. Compared with Chengdu hotpot, it is often heavier, punchier and more aggressively spicy.", "tip": "Do this even if you already had hotpot in Chengdu; the styles are noticeably different."}, {"city": "Chongqing", "name": "Xiaomian", "cn": "重庆小面", "desc": "Chongqing's everyday spicy noodles, usually seasoned with chilli oil, Sichuan pepper, garlic, preserved vegetables and sesame or peanuts.", "tip": "Excellent breakfast or quick lunch; busy neighbourhood noodle shops are ideal."}, {"city": "Chongqing", "name": "Suanlafen", "cn": "酸辣粉", "desc": "Springy sweet-potato noodles in a hot-and-sour broth with chilli, vinegar, peanuts and preserved vegetables.", "tip": "Great street-food option when you want something fast and punchy."}, {"city": "Chongqing", "name": "Grilled fish", "cn": "烤鱼", "desc": "A whole fish is grilled, then served in a sizzling tray with chillies, aromatics, vegetables and a rich sauce that keeps cooking at the table.", "tip": "Best shared between two or more people."}, {"city": "Chongqing", "name": "Laziji", "cn": "辣子鸡", "desc": "Small pieces of crisp fried chicken tossed with a mountain of dried chillies, Sichuan pepper and aromatics.", "tip": "You hunt through the chillies for the chicken; the dish is meant to be fragrant as well as hot."}, {"city": "Chongqing", "name": "Shaokao barbecue", "cn": "烧烤", "desc": "Late-night Chinese barbecue: skewers of meat, vegetables, tofu and other ingredients grilled over heat and heavily seasoned with chilli, cumin and spices.", "tip": "Best after dark with a few different skewers ordered to share."}, {"city": "Zhangjiajie", "name": "Tujia Sanxia Guo", "cn": "三下锅", "desc": "A hearty local Tujia pot containing a mixture of meats, tofu and vegetables cooked together with chilli and savoury seasonings.", "tip": "This is the signature Zhangjiajie dish to prioritise."}, {"city": "Zhangjiajie", "name": "Tujia smoked pork", "cn": "土家腊肉", "desc": "Pork that has been cured and smoked, giving it a salty, concentrated flavour. It is commonly stir-fried with vegetables or chillies.", "tip": "Good with rice after a long day in the national park."}, {"city": "Zhangjiajie", "name": "Hezha", "cn": "合渣", "desc": "A rustic Tujia dish made from ground soybeans cooked into a soft, comforting mixture, often with greens. It is mild compared with many dishes on this route.", "tip": "Useful as a break from spicy food."}, {"city": "Zhangjiajie", "name": "Sour fish / sour dishes", "cn": "酸鱼 / 酸味菜", "desc": "The wider Hunan and minority cuisines of the region make strong use of sour, pickled and fermented flavours, including fish and vegetable dishes.", "tip": "Ask the restaurant what sour speciality they make best that day."}, {"city": "Fenghuang", "name": "Blood duck", "cn": "血粑鸭", "desc": "Fenghuang's signature dish: duck cooked with chillies and pieces of blood rice cake, producing a rich, savoury and distinctly local Hunan-style dish.", "tip": "The English name sounds intimidating, but this is the food to try in Fenghuang."}, {"city": "Fenghuang", "name": "Miao sour fish / sour soup", "cn": "酸汤鱼", "desc": "Fish cooked in a tangy, spicy sour broth associated with Miao cuisine. The sourness typically comes from fermented or pickled ingredients.", "tip": "A good shared dinner beside the river."}, {"city": "Fenghuang", "name": "Smoked pork", "cn": "腊肉", "desc": "Cured and smoked pork is common across the Tujia and Miao areas, often stir-fried with local chillies, vegetables or preserved ingredients.", "tip": "Compare it with the smoked pork you try in Zhangjiajie."}, {"city": "Fenghuang", "name": "Rice tofu", "cn": "米豆腐", "desc": "A soft, slippery local snack made from rice rather than soy, usually cut into pieces and served with chilli, vinegar and savoury toppings.", "tip": "Good for a quick snack while wandering the old town."}, {"city": "Fenghuang", "name": "Ginger sweets", "cn": "姜糖", "desc": "Traditional chewy ginger candy made and stretched in shops around the ancient town, with a sweet, warming ginger flavour.", "tip": "Try a fresh sample before buying a bag."}, {"city": "Guilin", "name": "Guilin rice noodles", "cn": "桂林米粉", "desc": "The city's classic breakfast: rice noodles topped with braised meat, peanuts, pickled vegetables and a concentrated savoury sauce or broth.", "tip": "Eat them for breakfast at a busy local noodle shop."}, {"city": "Guilin", "name": "Gongcheng oil tea", "cn": "油茶", "desc": "A distinctive savoury tea soup made by pounding and frying tea leaves with ginger and other aromatics, then serving the brew with crunchy accompaniments.", "tip": "Unusual and slightly bitter; worth trying once for its strong local identity."}, {"city": "Guilin", "name": "Lipu taro pork", "cn": "荔浦芋扣肉", "desc": "Alternating slices of rich pork belly and fragrant Lipu taro are steamed together until soft, creating a sweet-savoury, deeply comforting dish.", "tip": "Best shared because it is quite rich."}, {"city": "Yangshuo", "name": "Beer fish", "cn": "啤酒鱼", "desc": "Yangshuo's signature dish: freshwater fish cooked with local beer, tomatoes, peppers, garlic and ginger until the sauce becomes rich and aromatic.", "tip": "Choose the fish carefully and confirm the price by weight before ordering."}, {"city": "Yangshuo", "name": "Stuffed river snails", "cn": "田螺酿", "desc": "River-snail shells filled with a seasoned mixture, commonly minced pork, snail meat and herbs, then cooked in a savoury sauce.", "tip": "A very local dish and a good one to share alongside beer fish."}];
const A = [{"city": "Beijing", "name": "Forbidden City", "cn": "故宫博物院", "priority": "Must-see", "desc": "The vast former imperial palace at the heart of Beijing, filled with ceremonial halls, courtyards and treasures from the Ming and Qing dynasties.", "tip": "Allow several hours; exiting north works well if you want to continue to Jingshan Park."}, {"city": "Beijing", "name": "Mutianyu Great Wall", "cn": "慕田峪长城", "priority": "Must-see", "desc": "A scenic and well-preserved Great Wall section in the mountains north of Beijing, with restored watchtowers and dramatic views.", "tip": "Cable or chairlift up and toboggan down is a fun combination in good weather."}, {"city": "Beijing", "name": "Temple of Heaven", "cn": "天坛", "priority": "High", "desc": "A major imperial ritual complex, best known for the circular Hall of Prayer for Good Harvests.", "tip": "Morning is especially atmospheric when locals exercise and socialise in the park."}, {"city": "Beijing", "name": "Summer Palace", "cn": "颐和园", "priority": "High", "desc": "A vast imperial garden of lakes, pavilions, bridges and hillside temples centred on Kunming Lake.", "tip": "Allow at least half a day if you want to explore beyond the main waterfront."}, {"city": "Beijing", "name": "Tiananmen Square", "cn": "天安门广场", "priority": "High", "desc": "Beijing's monumental central square, directly south of the Forbidden City and surrounded by major national landmarks.", "tip": "Leave buffer time for security and access arrangements."}, {"city": "Beijing", "name": "Hutongs & Shichahai", "cn": "胡同 / 什刹海", "priority": "High", "desc": "Historic lanes, courtyard neighbourhoods and lakes that show a slower, more lived-in side of Beijing.", "tip": "Best explored on foot without a rigid route."}, {"city": "Beijing", "name": "Jingshan Park", "cn": "景山公园", "priority": "High", "desc": "A hill immediately north of the Forbidden City with one of the best panoramic views over the palace roofs.", "tip": "Excellent near sunset when visibility is good."}, {"city": "Beijing", "name": "Lama Temple", "cn": "雍和宫", "priority": "Medium", "desc": "A major Tibetan Buddhist temple complex with incense-filled courtyards and ornate halls.", "tip": "Easy to combine with nearby hutongs and Wudaoying."}, {"city": "Xi'an", "name": "Terracotta Army", "cn": "秦始皇兵马俑", "priority": "Must-see", "desc": "Thousands of life-sized clay soldiers, horses and chariots created for the mausoleum of China's first emperor.", "tip": "Go early if possible and allow time for travel from central Xi'an."}, {"city": "Xi'an", "name": "Xi'an City Wall", "cn": "西安城墙", "priority": "Must-see", "desc": "One of China's best-preserved ancient city walls, forming a complete circuit around the old centre.", "tip": "Late afternoon into sunset is ideal; cycling part of it is memorable."}, {"city": "Xi'an", "name": "Muslim Quarter", "cn": "回民街", "priority": "High", "desc": "A dense historic area of food stalls, restaurants and lanes reflecting Xi'an's Hui Muslim community.", "tip": "Go hungry and treat it as a food wander rather than one restaurant meal."}, {"city": "Xi'an", "name": "Bell & Drum Towers", "cn": "钟楼 / 鼓楼", "priority": "High", "desc": "Two landmark towers at the centre of the old city, especially striking after dark.", "tip": "Combine them with the Muslim Quarter."}, {"city": "Xi'an", "name": "Great Mosque", "cn": "西安清真大寺", "priority": "High", "desc": "A historic mosque blending Islamic religious use with traditional Chinese architecture and courtyards.", "tip": "A quieter contrast to the surrounding food streets."}, {"city": "Xi'an", "name": "Big Wild Goose Pagoda", "cn": "大雁塔", "priority": "Medium", "desc": "A Tang-dynasty Buddhist pagoda associated with Xuanzang and the transmission of Buddhist texts to China.", "tip": "The surrounding area is lively in the evening."}, {"city": "Chengdu", "name": "Giant Panda Breeding Base", "cn": "成都大熊猫繁育研究基地", "priority": "Must-see", "desc": "Chengdu's famous panda conservation and breeding centre, with giant pandas and red pandas.", "tip": "Arrive early; pandas are generally more active in the cooler morning."}, {"city": "Chengdu", "name": "People's Park & Tea House", "cn": "人民公园", "priority": "Must-see", "desc": "A central park famous for tea drinking, mahjong, relaxed local life and people-watching.", "tip": "Sit down for tea and deliberately do very little for an hour."}, {"city": "Chengdu", "name": "Wenshu Monastery", "cn": "文殊院", "priority": "High", "desc": "A peaceful Buddhist monastery complex with courtyards, gardens and traditional architecture.", "tip": "Combine it with nearby snack streets and a slow wander."}, {"city": "Chengdu", "name": "Kuanzhai Alley", "cn": "宽窄巷子", "priority": "High", "desc": "Restored historic lanes lined with teahouses, snacks, shops and traditional-style buildings.", "tip": "Touristy but worthwhile for atmosphere, especially at a quieter time."}, {"city": "Chengdu", "name": "Jinli & Wuhou Shrine", "cn": "锦里 / 武侯祠", "priority": "High", "desc": "A historic-style pedestrian street beside a major shrine connected with the Three Kingdoms period.", "tip": "Best in late afternoon into evening for lights and food stalls."}, {"city": "Chongqing", "name": "Hongya Cave", "cn": "洪崖洞", "priority": "Must-see", "desc": "A dramatic multi-level riverside complex of stilt-style buildings and lights, one of Chongqing's signature night views.", "tip": "See it from outside as well as walking through the complex."}, {"city": "Chongqing", "name": "Liziba Monorail", "cn": "李子坝", "priority": "Must-see", "desc": "A monorail station famously integrated through a high-rise building, emblematic of Chongqing's vertical cityscape.", "tip": "Use the viewing area below for the classic angle."}, {"city": "Chongqing", "name": "Yangtze River Cableway", "cn": "长江索道", "priority": "High", "desc": "A cable car crossing the Yangtze with broad views over the skyline and steep riverbanks.", "tip": "Night views are excellent but queues can be longer."}, {"city": "Cho const FK = "china-food-passport-v1";
const AK = "china-attractions-passport-v1";
const DB_NAME = "china-food-passport-photos";

const el = {
  tabs: Array.from(document.querySelectorAll(".tab")),
  browse: document.getElementById("browse"),
  grid: document.getElementById("grid"),
  high: document.getElementById("high"),
  search: document.getElementById("search"),
  filter: document.getElementById("filter"),
  cities: document.getElementById("cities"),
  title: document.getElementById("title"),
  count: document.getElementById("count"),
  pt: document.getElementById("pt"),
  pp: document.getElementById("pp"),
  pb: document.getElementById("pb"),
  sd: document.getElementById("sd"),
  sdl: document.getElementById("sdl"),
  sa: document.getElementById("sa"),
  st: document.getElementById("st"),
  stl: document.getElementById("stl"),
  dlg: document.getElementById("dlg"),
  close: document.getElementById("x"),
  mn: document.getElementById("mn"),
  mc: document.getElementById("mc"),
  md: document.getElementById("md"),
  mt: document.getElementById("mt"),
  mv: document.getElementById("mv"),
  toast: document.getElementById("toast"),
  exportBtn: document.getElementById("export"),
  importInput: document.getElementById("import"),
  resetBtn: document.getElementById("reset")
};

let currentView = "food";
let activeCity = "All";
let foodState = loadState(FK);
let attractionState = loadState(AK);
let photoDb = null;
let renderToken = 0;

function loadState(key) {
  try {
    const value = JSON.parse(localStorage.getItem(key) || "{}");
    return value && typeof value === "object" ? value : {};
  } catch {
    return {};
  }
}

function saveState() {
  localStorage.setItem(FK, JSON.stringify(foodState));
  localStorage.setItem(AK, JSON.stringify(attractionState));
  updateHero();
}

function foodId(item) {
  return (item.city + "::" + item.name)
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");
}

function attractionId(item) {
  return "attr-" + foodId(item);
}

function itemId(item, type = currentView) {
  return type === "food" ? foodId(item) : attractionId(item);
}

function blankEntry() {
  return { done: false, score: "", notes: "" };
}

function stateEntry(type, id) {
  const store = type === "food" ? foodState : attractionState;
  if (!store[id]) store[id] = blankEntry();
  return store[id];
}

function isDone(type, entry) {
  if (type === "food") return Boolean(entry.done ?? entry.tried ?? false);
  return Boolean(entry.done);
}

function setDone(type, entry, value) {
  if (type === "food") {
    entry.tried = Boolean(value);
    entry.done = Boolean(value);
  } else {
    entry.done = Boolean(value);
  }
}

function showToast(message) {
  el.toast.textContent = message;
  el.toast.classList.add("on");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => el.toast.classList.remove("on"), 1700);
}

function openPhotoDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = () => {
      if (!request.result.objectStoreNames.contains("photos")) {
        request.result.createObjectStore("photos");
      }
    };
    request.onsuccess = () => {
      photoDb = request.result;
      resolve(photoDb);
    };
    request.onerror = () => reject(request.error);
  });
}

function photoGet(id) {
  return new Promise((resolve) => {
    if (!photoDb) return resolve(null);
    const request = photoDb.transaction("photos", "readonly").objectStore("photos").get(id);
    request.onsuccess = () => resolve(request.result || null);
    request.onerror = () => resolve(null);
  });
}

function photoPut(id, blob) {
  return new Promise((resolve, reject) => {
    if (!photoDb) return reject(new Error("Photo storage unavailable"));
    const tx = photoDb.transaction("photos", "readwrite");
    tx.objectStore("photos").put(blob, id);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

function photoClear() {
  return new Promise((resolve, reject) => {
    if (!photoDb) return resolve();
    const tx = photoDb.transaction("photos", "readwrite");
    tx.objectStore("photos").clear();
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const scale = Math.min(1, 1400 / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob) => {
          URL.revokeObjectURL(url);
          blob ? resolve(blob) : reject(new Error("Image conversion failed"));
        }, "image/jpeg", 0.82);
      } catch (error) {
        URL.revokeObjectURL(url);
        reject(error);
      }
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("Image could not be read"));
    };
    img.src = url;
  });
}

const CITY_ORDER = ["All", "Beijing", "Xi'an", "Chengdu", "Chongqing", "Zhangjiajie", "Fenghuang", "Guilin", "Yangshuo"];

function renderCities() {
  el.cities.innerHTML = "";
  CITY_ORDER.forEach((cityName) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "chip" + (cityName === activeCity ? " on" : "");
    button.textContent = cityName;
    button.addEventListener("click", () => {
      activeCity = cityName;
      renderCities();
      renderBrowser();
    });
    el.cities.appendChild(button);
  });
}

function currentItems() {
  return currentView === "food" ? F : A;
}

function filteredItems() {
  const query = el.search.value.trim().toLowerCase();
  const filter = el.filter.value;

  return currentItems().filter((item) => {
    const entry = stateEntry(currentView, itemId(item));
    const done = isDone(currentView, entry);

    if (activeCity !== "All" && item.city !== activeCity) return false;
    if (query && !(item.name + " " + item.cn + " " + item.city).toLowerCase().includes(query)) return false;
    if (filter === "no" && done) return false;
    if (filter === "yes" && !done) return false;
    if (filter === "9" && Number(entry.score) < 9) return false;
    return true;
  });
}

async function renderBrowser() {
  if (currentView === "high") {
    renderHighlights();
    return;
  }

  const myToken = ++renderToken;
  el.browse.hidden = false;
  el.grid.hidden = false;
  el.high.hidden = true;
  el.search.placeholder = currentView === "food"
    ? "Search food or Chinese name…"
    : "Search attraction or Chinese name…";

  const items = filteredItems();
  el.title.textContent = activeCity === "All"
    ? (currentView === "food" ? "All foods" : "All attractions")
    : activeCity;
  el.count.textContent = items.length + (currentView === "food" ? " dishes" : " sights");
  el.grid.innerHTML = "";

  if (!items.length) {
    el.grid.innerHTML = '<div class="empty">Nothing matches this view.</div>';
    return;
  }

  for (const item of items) {
    if (myToken !== renderToken) return;

    const id = itemId(item);
    const entry = stateEntry(currentView, id);
    const done = isDone(currentView, entry);

    const card = document.createElement("article");
    card.className = "card" + (done ? " done" : "");

    const main = document.createElement("div");
    main.className = "main";

    const photo = document.createElement("div");
    photo.className = "photo";
    photo.innerHTML = (currentView === "food" ? "📷" : "🏯") + "<small>Tap to add photo</small>";

    const existingPhoto = await photoGet(id);
    if (myToken !== renderToken) return;
    if (existingPhoto) {
      const img = document.createElement("img");
      img.alt = "Photo of " + item.name;
      img.src = URL.createObjectURL(existingPhoto);
      photo.appendChild(img);
      photo.querySelector("small").textContent = "Tap to replace";
    }

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "image/*";
    fileInput.hidden = true;
    fileInput.addEventListener("change", async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      try {
        await photoPut(id, await compressImage(file));
        showToast("Photo saved");
        renderBrowser();
      } catch {
        showToast("Could not save photo");
      }
    });
    photo.addEventListener("click", () => fileInput.click());
    photo.appendChild(fileInput);

    const body = document.createElement("div");
    body.className = "body";

    const top = document.createElement("div");
    top.className = "top";

    const titleWrap = document.createElement("div");
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = item.name;
    const chinese = document.createElement("div");
    chinese.className = "cn";
    chinese.textContent = item.cn;
    titleWrap.append(name, chinese);

    if (currentView === "sight") {
      const priority = document.createElement("span");
      priority.className = "pri " + item.priority.toLowerCase().replace(/\s+/g, "-");
      priority.textContent = item.priority;
      titleWrap.appendChild(priority);
    }

    const check = document.createElement("button");
    check.type = "button";
    check.className = "check" + (done ? " on" : "");
    check.textContent = done ? "✓" : "";
    check.setAttribute("aria-label", (done ? "Mark not completed: " : "Mark completed: ") + item.name);
    check.addEventListener("click", () => {
      setDone(currentView, entry, !done);
      saveState();
      renderBrowser();
    });

    top.append(titleWrap, check);

    const controls = document.createElement("div");
    controls.className = "controls";

    const score = document.createElement("select");
    score.className = "score";
    score.setAttribute("aria-label", "Score " + item.name + " out of 10");
    score.innerHTML = '<option value="">Score /10</option>' +
      Array.from({ length: 10 }, (_, i) => {
        const n = i + 1;
        return '<option value="' + n + '">' + n + '/10</option>';
      }).join("");
    score.value = entry.score || "";
    score.addEventListener("change", () => {
      entry.score = score.value;
      if (score.value) setDone(currentView, entry, true);
      saveState();
      renderBrowser();
    });

    const about = document.createElement("button");
    about.type = "button";
    about.className = "btn info";
    about.textContent = currentView === "food" ? "What is it?" : "About";
    about.addEventListener("click", () => openInfo(item));

    const notesButton = document.createElement("button");
    notesButton.type = "button";
    notesButton.className = "btn";
    notesButton.textContent = entry.notes ? "Edit notes" : "Add notes";

    const notes = document.createElement("textarea");
    notes.className = "notes";
    notes.placeholder = currentView === "food"
      ? "Where did you eat it? What did you think?"
      : "What stood out? Any tips or memories?";
    notes.value = entry.notes || "";

    notesButton.addEventListener("click", () => {
      notes.classList.toggle("on");
      if (notes.classList.contains("on")) notes.focus();
    });
    notes.addEventListener("change", () => {
      entry.notes = notes.value.trim();
      saveState();
      notesButton.textContent = entry.notes ? "Edit notes" : "Add notes";
    });

    controls.append(score, about, notesButton, notes);
    body.append(top, controls);
    main.append(photo, body);
    card.appendChild(main);

    const footer = document.createElement("div");
    footer.className = "foot";
    footer.textContent = item.city;
    card.appendChild(footer);

    el.grid.appendChild(card);
  }
}

function openInfo(item) {
  el.mn.textContent = item.name;
  el.mc.textContent = item.cn;
  el.md.textContent = item.desc;
  el.mv.textContent = item.tip;
  el.mt.textContent = currentView === "food" ? "Ordering tip" : "Visit tip";
  if (typeof el.dlg.showModal === "function") el.dlg.showModal();
  else el.dlg.setAttribute("open", "");
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function ranking(items, type) {
  return items
    .map((item) => {
      const id = type === "food" ? foodId(item) : attractionId(item);
      const store = type === "food" ? foodState : attractionState;
      const entry = store[id] || blankEntry();
      return { item, score: Number(entry.score) || 0 };
    })
    .filter((row) => row.score > 0)
    .sort((a, b) => b.score - a.score || a.item.name.localeCompare(b.item.name))
    .slice(0, 5);
}

function rankingBox(title, rows) {
  let html = '<div class="box"><h3>' + title + '</h3><div class="rank">';
  if (!rows.length) {
    html += '<div class="empty">Start scoring to build your ranking.</div>';
  }
  rows.forEach((row, index) => {
    html += '<div class="ri">' +
      '<div class="num">' + (index + 1) + '</div>' +
      '<div><b>' + escapeHtml(row.item.name) + '</b><small>' + escapeHtml(row.item.city) + '</small></div>' +
      '<div class="rs">' + row.score + '/10</div>' +
      '</div>';
  });
  return html + "</div></div>";
}

function renderHighlights() {
  ++renderToken;
  el.browse.hidden = true;
  el.grid.hidden = true;
  el.high.hidden = false;

  let html =
    rankingBox("🍜 Favourite foods", ranking(F, "food")) +
    rankingBox("🏯 Favourite attractions", ranking(A, "sight"));

  let cityRows = "";
  CITY_ORDER.slice(1).forEach((cityName) => {
    const cityFoods = F.filter((x) => x.city === cityName);
    const citySights = A.filter((x) => x.city === cityName);

    const foodDone = cityFoods.filter((x) => isDone("food", foodState[foodId(x)] || blankEntry())).length;
    const sightDone = citySights.filter((x) => isDone("sight", attractionState[attractionId(x)] || blankEntry())).length;
    const done = foodDone + sightDone;
    const total = cityFoods.length + citySights.length;
    const pct = total ? Math.round(done / total * 100) : 0;

    cityRows += '<div class="cityrow">' +
      '<b>' + escapeHtml(cityName) + '</b>' +
      '<div class="mini"><div style="width:' + pct + '%"></div></div>' +
      '<span>' + pct + '%</span>' +
      '</div>';
  });

  html += '<div class="box"><h3>🗺️ City completion</h3>' + cityRows + "</div>";

  const bestFood = ranking(F, "food")[0];
  const bestSight = ranking(A, "sight")[0];
  html += '<div class="box"><h3>✨ Trip favourites</h3>' +
    '<p><b>Best food:</b> ' + (bestFood ? escapeHtml(bestFood.item.name) + " — " + bestFood.score + "/10" : "Not rated yet") + '</p>' +
    '<p><b>Best sight:</b> ' + (bestSight ? escapeHtml(bestSight.item.name) + " — " + bestSight.score + "/10" : "Not rated yet") + '</p>' +
    "</div>";

  el.high.innerHTML = html;
  updateHero();
}

function updateHero() {
  let entries = [];
  let doneCount = 0;
  let total = 0;

  if (currentView === "food") {
    entries = F.map((x) => foodState[foodId(x)] || blankEntry());
    doneCount = entries.filter((z) => isDone("food", z)).length;
    total = F.length;
    el.sdl.textContent = "foods tried";
    el.stl.textContent = "foods";
  } else if (currentView === "sight") {
    entries = A.map((x) => attractionState[attractionId(x)] || blankEntry());
    doneCount = entries.filter((z) => isDone("sight", z)).length;
    total = A.length;
    el.sdl.textContent = "sights visited";
    el.stl.textContent = "sights";
  } else {
    const foodEntries = F.map((x) => foodState[foodId(x)] || blankEntry());
    const sightEntries = A.map((x) => attractionState[attractionId(x)] || blankEntry());
    entries = [...foodEntries, ...sightEntries];
    doneCount =
      foodEntries.filter((z) => isDone("food", z)).length +
      sightEntries.filter((z) => isDone("sight", z)).length;
    total = F.length + A.length;
    el.sdl.textContent = "completed";
    el.stl.textContent = "total items";
  }

  const scores = entries.map((z) => Number(z.score)).filter((n) => Number.isFinite(n) && n > 0);
  const average = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : "—";
  const pct = total ? Math.round(doneCount / total * 100) : 0;

  el.pt.textContent = doneCount + " of " + total + " completed";
  el.pp.textContent = pct + "%";
  el.pb.style.width = pct + "%";
  el.sd.textContent = doneCount;
  el.sa.textContent = average;
  el.st.textContent = total;
}

function switchView(nextView) {
  currentView = nextView;
  activeCity = "All";
  el.tabs.forEach((button) => button.classList.toggle("on", button.dataset.v === currentView));
  renderCities();
  updateHero();
  if (currentView === "high") renderHighlights();
  else renderBrowser();
}

function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

function dataUrlToBlob(dataUrl) {
  const parts = dataUrl.split(",");
  const match = /^data:([^;]+);base64$/.exec(parts[0]);
  if (!match || !parts[1]) throw new Error("Invalid image backup");
  const bytes = atob(parts[1]);
  const array = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) array[i] = bytes.charCodeAt(i);
  return new Blob([array], { type: match[1] });
}

async function exportBackup() {
  try {
    const photos = {};
    for (const item of F) {
      const id = foodId(item);
      const blob = await photoGet(id);
      if (blob) photos[id] = await blobToDataUrl(blob);
    }
    for (const item of A) {
      const id = attractionId(item);
      const blob = await photoGet(id);
      if (blob) photos[id] = await blobToDataUrl(blob);
    }

    const payload = {
      version: 2.1,
      exportedAt: new Date().toISOString(),
      foodState,
      attrState: attractionState,
      photos
    };
    const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "china-trip-passport-backup.json";
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    showToast("Backup exported");
  } catch {
    showToast("Could not export backup");
  }
}

async function importBackup(file) {
  try {
    const payload = JSON.parse(await file.text());
    if (!payload || typeof payload !== "object") throw new Error("Invalid backup");

    foodState = payload.foodState || payload.state || foodState;
    attractionState = payload.attrState || attractionState;

    if (payload.photos && typeof payload.photos === "object") {
      for (const [id, dataUrl] of Object.entries(payload.photos)) {
        if (typeof dataUrl === "string" && dataUrl.startsWith("data:")) {
          await photoPut(id, dataUrlToBlob(dataUrl));
        }
      }
    }

    saveState();
    showToast("Backup imported");
    if (currentView === "high") renderHighlights();
    else renderBrowser();
  } catch {
    showToast("Could not import backup");
  }
}

el.tabs.forEach((button) => {
  button.addEventListener("click", () => switchView(button.dataset.v));
});
el.search.addEventListener("input", renderBrowser);
el.filter.addEventListener("change", renderBrowser);
el.close.addEventListener("click", () => {
  if (typeof el.dlg.close === "function") el.dlg.close();
  else el.dlg.removeAttribute("open");
});
el.exportBtn.addEventListener("click", exportBackup);
el.importInput.addEventListener("change", async (event) => {
  const file = event.target.files && event.target.files[0];
  if (file) await importBackup(file);
  event.target.value = "";
});
el.resetBtn.addEventListener("click", async () => {
  if (!confirm("Reset all food and attraction checkmarks, scores, notes and photos?")) return;
  foodState = {};
  attractionState = {};
  localStorage.removeItem(FK);
  localStorage.removeItem(AK);
  await photoClear().catch(() => {});
  saveState();
  showToast("Trip data reset");
  if (currentView === "high") renderHighlights();
  else renderBrowser();
});

(async function init() {
  try {
    await openPhotoDb();
  } catch {
    showToast("Photos may not persist in this browser");
  }
  renderCities();
  updateHero();
  renderBrowser();

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
})();
