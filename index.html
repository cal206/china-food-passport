<script>
const F=[{"city": "Beijing", "name": "Peking duck", "cn": "北京烤鸭", "desc": "Roast duck with lacquered, crisp skin and tender meat, usually carved tableside and wrapped in thin pancakes with spring onion, cucumber and sweet bean sauce.", "tip": "Book one proper duck meal; for two people, half a duck is often enough."}, {"city": "Beijing", "name": "Zhajiangmian", "cn": "炸酱面", "desc": "Thick wheat noodles topped with a savoury fried soybean-and-pork sauce, then mixed with fresh shredded vegetables. It is one of Beijing's classic everyday noodle dishes.", "tip": "A great casual lunch; mix everything thoroughly before eating."}, {"city": "Beijing", "name": "Jianbing", "cn": "煎饼", "desc": "A hot savoury breakfast crepe cooked on a griddle with egg, herbs and sauce, usually folded around a crisp cracker for crunch.", "tip": "Best from a busy breakfast stall in the morning."}, {"city": "Beijing", "name": "Copper-pot mutton hotpot", "cn": "涮羊肉", "desc": "Paper-thin slices of lamb are quickly swished in a light broth inside a traditional copper pot, then dipped in a rich sesame-based sauce.", "tip": "Very different from Sichuan hotpot: lighter, lamb-focused and traditionally Beijing."}, {"city": "Beijing", "name": "Jiaozi dumplings", "cn": "饺子", "desc": "Boiled or steamed dumplings filled with combinations such as pork, chive, cabbage, lamb or vegetables, usually eaten with vinegar and garlic.", "tip": "Order several fillings to share."}, {"city": "Beijing", "name": "Douzhi", "cn": "豆汁", "desc": "A traditional fermented mung-bean drink with a strong sour, funky flavour. It is one of Beijing's most notorious local tastes and is often served with fried dough rings.", "tip": "Try a small serving for the experience; this is very much a love-it-or-hate-it food."}, {"city": "Xi'an", "name": "Biang Biang noodles", "cn": "油泼扯面 / Biángbiáng面", "desc": "Very wide, hand-pulled wheat noodles dressed with chilli, garlic, vinegar and hot oil. Chewy, aromatic and one of Shaanxi's signature dishes.", "tip": "One of the highest-priority foods on the whole trip."}, {"city": "Xi'an", "name": "Roujiamo", "cn": "肉夹馍", "desc": "A crisp, dense flatbread split and stuffed with finely chopped slow-braised meat. Often described as a Chinese hamburger, but with a much older history.", "tip": "Perfect as a snack while exploring the city."}, {"city": "Xi'an", "name": "Yangrou paomo", "cn": "羊肉泡馍", "desc": "A deeply savoury lamb or mutton broth served with small pieces of dense flatbread. Traditionally, diners tear the bread into tiny pieces before the kitchen adds the soup.", "tip": "Give yourself time for the bread-tearing ritual; it is part of the experience."}, {"city": "Xi'an", "name": "Liangpi", "cn": "凉皮", "desc": "Cool, springy wheat or rice noodles dressed with chilli oil, vinegar, garlic, sesame and often cucumber or bean sprouts.", "tip": "Especially good as a light lunch alongside roujiamo."}, {"city": "Xi'an", "name": "Local dumplings", "cn": "饺子 / 饺子宴", "desc": "Xi'an has a strong dumpling tradition, from simple boiled dumplings to elaborate dumpling banquets with many shapes and fillings.", "tip": "A dumpling banquet is fun, but a small local shop is often better value."}, {"city": "Xi'an", "name": "Persimmon cake", "cn": "柿子饼", "desc": "A sweet Shaanxi snack made from persimmon dough, often filled with ingredients such as nuts or sesame and pan-fried until soft and fragrant.", "tip": "Look for freshly cooked ones around the old city rather than packaged versions."}, {"city": "Chengdu", "name": "Sichuan hotpot", "cn": "四川火锅", "desc": "A bubbling communal pot flavoured with dried chillies, Sichuan peppercorns and aromatics. Ingredients are cooked at the table and dipped into a personal sauce.", "tip": "Choose a split pot or mild spice level if you want to enjoy more than just the heat."}, {"city": "Chengdu", "name": "Mapo tofu", "cn": "麻婆豆腐", "desc": "Silky tofu in a glossy sauce of minced meat, fermented bean paste, chilli and Sichuan pepper. A proper Chengdu version balances heat, salt, richness and numbing pepper.", "tip": "Eat it with plain rice so you can appreciate the sauce."}, {"city": "Chengdu", "name": "Dan Dan noodles", "cn": "担担面", "desc": "A small bowl of noodles tossed with chilli oil, Sichuan pepper, preserved vegetables, sesame or peanut notes and often minced pork.", "tip": "Usually a snack-sized portion, so it is easy to combine with other dishes."}, {"city": "Chengdu", "name": "Chuan Chuan", "cn": "串串香", "desc": "A huge selection of meats, tofu, mushrooms and vegetables served on skewers and cooked in a spicy communal broth.", "tip": "Pick a few unfamiliar skewers as well as safe favourites; you normally pay by counting sticks."}, {"city": "Chengdu", "name": "Zhong dumplings", "cn": "钟水饺", "desc": "Soft pork dumplings dressed in a glossy sauce that combines chilli oil, garlic and a slightly sweet seasoned soy sauce.", "tip": "A good choice at a traditional Chengdu snack restaurant."}, {"city": "Chengdu", "name": "Sweet-water noodles", "cn": "甜水面", "desc": "Thick, chewy noodles coated in a sweet-savoury-spicy sauce with sesame, chilli and aromatic soy flavours.", "tip": "The texture is the star; order a small bowl as part of a snack crawl."}, {"city": "Chengdu", "name": "Rabbit head", "cn": "兔头", "desc": "A famous Chengdu snack of rabbit head braised and coated in intense chilli and Sichuan pepper seasoning. Diners pick the meat carefully from around the bone.", "tip": "Definitely optional, but one of the city's most distinctive food experiences."}, {"city": "Chongqing", "name": "Chongqing hotpot", "cn": "重庆火锅", "desc": "An intense beef-tallow hotpot packed with dried chilli and Sichuan pepper. Compared with Chengdu hotpot, it is often heavier, punchier and more aggressively spicy.", "tip": "Do this even if you already had hotpot in Chengdu; the styles are noticeably different."}, {"city": "Chongqing", "name": "Xiaomian", "cn": "重庆小面", "desc": "Chongqing's everyday spicy noodles, usually seasoned with chilli oil, Sichuan pepper, garlic, preserved vegetables and sesame or peanuts.", "tip": "Excellent breakfast or quick lunch; busy neighbourhood noodle shops are ideal."}, {"city": "Chongqing", "name": "Suanlafen", "cn": "酸辣粉", "desc": "Springy sweet-potato noodles in a hot-and-sour broth with chilli, vinegar, peanuts and preserved vegetables.", "tip": "Great street-food option when you want something fast and punchy."}, {"city": "Chongqing", "name": "Grilled fish", "cn": "烤鱼", "desc": "A whole fish is grilled, then served in a sizzling tray with chillies, aromatics, vegetables and a rich sauce that keeps cooking at the table.", "tip": "Best shared between two or more people."}, {"city": "Chongqing", "name": "Laziji", "cn": "辣子鸡", "desc": "Small pieces of crisp fried chicken tossed with a mountain of dried chillies, Sichuan pepper and aromatics.", "tip": "You hunt through the chillies for the chicken; the dish is meant to be fragrant as well as hot."}, {"city": "Chongqing", "name": "Shaokao barbecue", "cn": "烧烤", "desc": "Late-night Chinese barbecue: skewers of meat, vegetables, tofu and other ingredients grilled over heat and heavily seasoned with chilli, cumin and spices.", "tip": "Best after dark with a few different skewers ordered to share."}, {"city": "Zhangjiajie", "name": "Tujia Sanxia Guo", "cn": "三下锅", "desc": "A hearty local Tujia pot containing a mixture of meats, tofu and vegetables cooked together with chilli and savoury seasonings.", "tip": "This is the signature Zhangjiajie dish to prioritise."}, {"city": "Zhangjiajie", "name": "Tujia smoked pork", "cn": "土家腊肉", "desc": "Pork that has been cured and smoked, giving it a salty, concentrated flavour. It is commonly stir-fried with vegetables or chillies.", "tip": "Good with rice after a long day in the national park."}, {"city": "Zhangjiajie", "name": "Hezha", "cn": "合渣", "desc": "A rustic Tujia dish made from ground soybeans cooked into a soft, comforting mixture, often with greens. It is mild compared with many dishes on this route.", "tip": "Useful as a break from spicy food."}, {"city": "Zhangjiajie", "name": "Sour fish / sour dishes", "cn": "酸鱼 / 酸味菜", "desc": "The wider Hunan and minority cuisines of the region make strong use of sour, pickled and fermented flavours, including fish and vegetable dishes.", "tip": "Ask the restaurant what sour speciality they make best that day."}, {"city": "Fenghuang", "name": "Blood duck", "cn": "血粑鸭", "desc": "Fenghuang's signature dish: duck cooked with chillies and pieces of blood rice cake, producing a rich, savoury and distinctly local Hunan-style dish.", "tip": "The English name sounds intimidating, but this is the food to try in Fenghuang."}, {"city": "Fenghuang", "name": "Miao sour fish / sour soup", "cn": "酸汤鱼", "desc": "Fish cooked in a tangy, spicy sour broth associated with Miao cuisine. The sourness typically comes from fermented or pickled ingredients.", "tip": "A good shared dinner beside the river."}, {"city": "Fenghuang", "name": "Smoked pork", "cn": "腊肉", "desc": "Cured and smoked pork is common across the Tujia and Miao areas, often stir-fried with local chillies, vegetables or preserved ingredients.", "tip": "Compare it with the smoked pork you try in Zhangjiajie."}, {"city": "Fenghuang", "name": "Rice tofu", "cn": "米豆腐", "desc": "A soft, slippery local snack made from rice rather than soy, usually cut into pieces and served with chilli, vinegar and savoury toppings.", "tip": "Good for a quick snack while wandering the old town."}, {"city": "Fenghuang", "name": "Ginger sweets", "cn": "姜糖", "desc": "Traditional chewy ginger candy made and stretched in shops around the ancient town, with a sweet, warming ginger flavour.", "tip": "Try a fresh sample before buying a bag."}, {"city": "Guilin", "name": "Guilin rice noodles", "cn": "桂林米粉", "desc": "The city's classic breakfast: rice noodles topped with braised meat, peanuts, pickled vegetables and a concentrated savoury sauce or broth.", "tip": "Eat them for breakfast at a busy local noodle shop."}, {"city": "Guilin", "name": "Gongcheng oil tea", "cn": "油茶", "desc": "A distinctive savoury tea soup made by pounding and frying tea leaves with ginger and other aromatics, then serving the brew with crunchy accompaniments.", "tip": "Unusual and slightly bitter; worth trying once for its strong local identity."}, {"city": "Guilin", "name": "Lipu taro pork", "cn": "荔浦芋扣肉", "desc": "Alternating slices of rich pork belly and fragrant Lipu taro are steamed together until soft, creating a sweet-savoury, deeply comforting dish.", "tip": "Best shared because it is quite rich."}, {"city": "Yangshuo", "name": "Beer fish", "cn": "啤酒鱼", "desc": "Yangshuo's signature dish: freshwater fish cooked with local beer, tomatoes, peppers, garlic and ginger until the sauce becomes rich and aromatic.", "tip": "Choose the fish carefully and confirm the price by weight before ordering."}, {"city": "Yangshuo", "name": "Stuffed river snails", "cn": "田螺酿", "desc": "River-snail shells filled with a seasoned mixture, commonly minced pork, snail meat and herbs, then cooked in a savoury sauce.", "tip": "A very local dish and a good one to share alongside beer fish."}],A=[{"city": "Beijing", "name": "Forbidden City", "cn": "故宫博物院", "priority": "Must-see", "desc": "The vast former imperial palace at the heart of Beijing, filled with ceremonial halls, courtyards and treasures from the Ming and Qing dynasties.", "tip": "Allow several hours; exiting north works well if you want to continue to Jingshan Park."}, {"city": "Beijing", "name": "Mutianyu Great Wall", "cn": "慕田峪长城", "priority": "Must-see", "desc": "A scenic and well-preserved Great Wall section in the mountains north of Beijing, with restored watchtowers and dramatic views.", "tip": "Cable or chairlift up and toboggan down is a fun combination in good weather."}, {"city": "Beijing", "name": "Temple of Heaven", "cn": "天坛", "priority": "High", "desc": "A major imperial ritual complex, best known for the circular Hall of Prayer for Good Harvests.", "tip": "Morning is especially atmospheric when locals exercise and socialise in the park."}, {"city": "Beijing", "name": "Summer Palace", "cn": "颐和园", "priority": "High", "desc": "A vast imperial garden of lakes, pavilions, bridges and hillside temples centred on Kunming Lake.", "tip": "Allow at least half a day if you want to explore beyond the main waterfront."}, {"city": "Beijing", "name": "Tiananmen Square", "cn": "天安门广场", "priority": "High", "desc": "Beijing's monumental central square, directly south of the Forbidden City and surrounded by major national landmarks.", "tip": "Leave buffer time for security and access arrangements."}, {"city": "Beijing", "name": "Hutongs & Shichahai", "cn": "胡同 / 什刹海", "priority": "High", "desc": "Historic lanes, courtyard neighbourhoods and lakes that show a slower, more lived-in side of Beijing.", "tip": "Best explored on foot without a rigid route."}, {"city": "Beijing", "name": "Jingshan Park", "cn": "景山公园", "priority": "High", "desc": "A hill immediately north of the Forbidden City with one of the best panoramic views over the palace roofs.", "tip": "Excellent near sunset when visibility is good."}, {"city": "Beijing", "name": "Lama Temple", "cn": "雍和宫", "priority": "Medium", "desc": "A major Tibetan Buddhist temple complex with incense-filled courtyards and ornate halls.", "tip": "Easy to combine with nearby hutongs and Wudaoying."}, {"city": "Xi'an", "name": "Terracotta Army", "cn": "秦始皇兵马俑", "priority": "Must-see", "desc": "Thousands of life-sized clay soldiers, horses and chariots created for the mausoleum of China's first emperor.", "tip": "Go early if possible and allow time for travel from central Xi'an."}, {"city": "Xi'an", "name": "Xi'an City Wall", "cn": "西安城墙", "priority": "Must-see", "desc": "One of China's best-preserved ancient city walls, forming a complete circuit around the old centre.", "tip": "Late afternoon into sunset is ideal; cycling part of it is memorable."}, {"city": "Xi'an", "name": "Muslim Quarter", "cn": "回民街", "priority": "High", "desc": "A dense historic area of food stalls, restaurants and lanes reflecting Xi'an's Hui Muslim community.", "tip": "Go hungry and treat it as a food wander rather than one restaurant meal."}, {"city": "Xi'an", "name": "Bell & Drum Towers", "cn": "钟楼 / 鼓楼", "priority": "High", "desc": "Two landmark towers at the centre of the old city, especially striking after dark.", "tip": "Combine them with the Muslim Quarter."}, {"city": "Xi'an", "name": "Great Mosque", "cn": "西安清真大寺", "priority": "High", "desc": "A historic mosque blending Islamic religious use with traditional Chinese architecture and courtyards.", "tip": "A quieter contrast to the surrounding food streets."}, {"city": "Xi'an", "name": "Big Wild Goose Pagoda", "cn": "大雁塔", "priority": "Medium", "desc": "A Tang-dynasty Buddhist pagoda associated with Xuanzang and the transmission of Buddhist texts to China.", "tip": "The surrounding area is lively in the evening."}, {"city": "Chengdu", "name": "Giant Panda Breeding Base", "cn": "成都大熊猫繁育研究基地", "priority": "Must-see", "desc": "Chengdu's famous panda conservation and breeding centre, with giant pandas and red pandas.", "tip": "Arrive early; pandas are generally more active in the cooler morning."}, {"city": "Chengdu", "name": "People's Park & Tea House", "cn": "人民公园", "priority": "Must-see", "desc": "A central park famous for tea drinking, mahjong, relaxed local life and people-watching.", "tip": "Sit down for tea and deliberately do very little for an hour."}, {"city": "Chengdu", "name": "Wenshu Monastery", "cn": "文殊院", "priority": "High", "desc": "A peaceful Buddhist monastery complex with courtyards, gardens and traditional architecture.", "tip": "Combine it with nearby snack streets and a slow wander."}, {"city": "Chengdu", "name": "Kuanzhai Alley", "cn": "宽窄巷子", "priority": "High", "desc": "Restored historic lanes lined with teahouses, snacks, shops and traditional-style buildings.", "tip": "Touristy but worthwhile for atmosphere, especially at a quieter time."}, {"city": "Chengdu", "name": "Jinli & Wuhou Shrine", "cn": "锦里 / 武侯祠", "priority": "High", "desc": "A historic-style pedestrian street beside a major shrine connected with the Three Kingdoms period.", "tip": "Best in late afternoon into evening for lights and food stalls."}, {"city": "Chongqing", "name": "Hongya Cave", "cn": "洪崖洞", "priority": "Must-see", "desc": "A dramatic multi-level riverside complex of stilt-style buildings and lights, one of Chongqing's signature night views.", "tip": "See it from outside as well as walking through the complex."}, {"city": "Chongqing", "name": "Liziba Monorail", "cn": "李子坝", "priority": "Must-see", "desc": "A monorail station famously integrated through a high-rise building, emblematic of Chongqing's vertical cityscape.", "tip": "Use the viewing area below for the classic angle."}, {"city": "Chongqing", "name": "Yangtze River Cableway", "cn": "长江索道", "priority": "High", "desc": "A cable car crossing the Yangtze with broad views over the skyline and steep riverbanks.", "tip": "Night views are excellent but queues can be longer."}, {"city": "Chongqing", "name": "Shibati / Eighteen Steps", "cn": "十八梯", "priority": "High", "desc": "A rebuilt historic hillside district of steep lanes, stairs, shops and layered city views.", "tip": "Combine it with Jiefangbei on foot."}, {"city": "Chongqing", "name": "Jiefangbei", "cn": "解放碑", "priority": "High", "desc": "The central pedestrian and commercial core of downtown Chongqing.", "tip": "Best used as a base for evening wandering rather than a standalone sight."}, {"city": "Chongqing", "name": "Ciqikou Ancient Town", "cn": "磁器口古镇", "priority": "Medium", "desc": "A historic town area with old lanes, temples, snack shops and traditional-style storefronts.", "tip": "Go early if you want it to feel less crowded and commercial."}, {"city": "Zhangjiajie", "name": "Yuanjiajie", "cn": "袁家界", "priority": "Mus
