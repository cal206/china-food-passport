<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9b1c1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="China Food">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>China Food Passport</title>
  <style>
    :root {
      --red:#9b1c1c; --red2:#7d1515; --cream:#fff7e8; --paper:#fffdfa;
      --ink:#2e2824; --muted:#746b63; --line:#e5ddd2; --green:#2f7d4a;
      --gold:#b98519; --shadow:0 8px 28px rgba(70,35,20,.10);
    }
    * { box-sizing:border-box; }
    html { background:#f7f2eb; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    body { margin:0; min-height:100%; background:linear-gradient(180deg,#fdf8f0 0,#f7f2eb 260px); }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; }
    .app { max-width:760px; margin:0 auto; padding:env(safe-area-inset-top) 14px calc(40px + env(safe-area-inset-bottom)); }
    .hero {
      margin:0 -14px 14px; padding:24px 18px 20px;
      background:var(--red); color:white; border-radius:0 0 28px 28px;
      box-shadow:var(--shadow);
    }
    .eyebrow { font-size:12px; letter-spacing:.13em; text-transform:uppercase; opacity:.8; font-weight:700; }
    h1 { margin:5px 0 6px; font-family:Georgia,serif; font-size:32px; line-height:1.05; }
    .subtitle { margin:0; opacity:.9; font-size:14px; }
    .progress-wrap { margin-top:18px; display:grid; gap:7px; }
    .progress-line { display:flex; justify-content:space-between; gap:10px; font-size:13px; }
    .progress { height:10px; background:rgba(255,255,255,.22); border-radius:99px; overflow:hidden; }
    .progress > div { height:100%; width:0; background:#ffd98d; border-radius:99px; transition:width .25s ease; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
    .stat { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.16); border-radius:14px; padding:10px; }
    .stat b { display:block; font-size:20px; }
    .stat span { font-size:11px; opacity:.8; }
    .toolbar {
      display:grid; grid-template-columns:1fr auto; gap:8px; margin:14px 0 10px;
    }
    .search { width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:14px; background:white; color:var(--ink); min-height:44px; }
    .filter { border:1px solid var(--line); border-radius:14px; background:white; color:var(--ink); padding:0 12px; min-height:44px; }
    .cities { display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none; }
    .cities::-webkit-scrollbar { display:none; }
    .chip {
      flex:0 0 auto; border:1px solid var(--line); background:white; color:var(--ink);
      border-radius:999px; padding:9px 13px; min-height:40px; font-weight:700; font-size:13px;
    }
    .chip.active { background:var(--red); border-color:var(--red); color:white; }
    .section-head { display:flex; justify-content:space-between; align-items:end; gap:10px; margin:14px 2px 8px; }
    .section-head h2 { margin:0; font-size:22px; font-family:Georgia,serif; }
    .section-head span { color:var(--muted); font-size:12px; }
    .grid { display:grid; gap:11px; }
    .card {
      background:var(--paper); border:1px solid var(--line); border-radius:20px;
      box-shadow:0 3px 14px rgba(60,30,15,.055); overflow:hidden;
    }
    .card.tried { border-color:#bdd8c7; }
    .card-main { display:grid; grid-template-columns:92px 1fr; min-height:116px; }
    .photo {
      background:#eee7de; position:relative; overflow:hidden; display:grid; place-items:center; color:#8a8178;
    }
    .photo img { width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
    .photo-placeholder { font-size:28px; }
    .photo small { position:absolute; bottom:7px; left:7px; right:7px; text-align:center; font-size:10px; background:rgba(255,255,255,.78); color:#4d463f; border-radius:8px; padding:3px; }
    .body { padding:12px 12px 10px; min-width:0; }
    .toprow { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
    .name { font-weight:800; line-height:1.2; font-size:16px; }
    .cn { font-size:13px; color:var(--muted); margin-top:3px; }
    .check {
      width:30px; height:30px; border-radius:9px; border:2px solid #cbbfb2; background:white; flex:0 0 auto;
      display:grid; place-items:center; color:white; font-weight:900;
    }
    .check.on { background:var(--green); border-color:var(--green); }
    .controls { display:flex; flex-wrap:wrap; gap:8px; margin-top:11px; align-items:center; }
    .score { min-height:38px; border:1px solid var(--line); background:white; border-radius:10px; padding:0 9px; }
    .small-btn {
      min-height:38px; border:1px solid var(--line); background:white; border-radius:10px; padding:0 10px; color:var(--ink); font-weight:700;
    }
    .small-btn.primary { background:var(--cream); border-color:#eed9af; color:#6f4d0f; }
    .notes {
      display:none; width:100%; margin-top:10px; min-height:68px; border:1px solid var(--line);
      border-radius:12px; padding:10px; resize:vertical; background:#fff;
    }
    .notes.open { display:block; }
    .card-footer { padding:0 12px 12px 104px; margin-top:-2px; }
    .city-tag { font-size:11px; color:var(--muted); }
    .empty { text-align:center; color:var(--muted); padding:38px 10px; }
    .bottom-actions { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 0; }
    .bottom-actions button,.import-label {
      border:1px solid var(--line); background:white; border-radius:12px; min-height:42px; padding:0 12px; font-weight:700; color:var(--ink); display:inline-flex; align-items:center; justify-content:center;
    }
    .import-label input { display:none; }
    dialog {
      width:min(92vw,520px); border:none; border-radius:22px; padding:0; color:var(--ink); box-shadow:0 24px 70px rgba(40,20,10,.28);
    }
    dialog::backdrop { background:rgba(40,25,18,.48); backdrop-filter:blur(2px); }
    .modal { padding:20px; background:var(--paper); }
    .modal h3 { margin:0 34px 4px 0; font-family:Georgia,serif; font-size:24px; }
    .modal .cn { font-size:15px; }
    .modal p { line-height:1.55; }
    .tip { background:var(--cream); border:1px solid #ecd8ad; border-radius:14px; padding:12px; }
    .close { position:absolute; right:12px; top:12px; width:38px; height:38px; border:none; border-radius:50%; background:#f2ece5; font-size:20px; }
    .toast { position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#2e2824; color:white; padding:10px 14px; border-radius:12px; font-size:13px; opacity:0; pointer-events:none; transition:.2s; z-index:50; }
    .toast.show { opacity:1; }
    @media (min-width:620px) {
      .grid { grid-template-columns:1fr 1fr; }
      .card-footer { padding-left:12px; }
      .toolbar { grid-template-columns:1fr 150px; }
    }
    @media (prefers-reduced-motion:reduce) {
      * { scroll-behavior:auto !important; transition:none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="eyebrow">20-day China trip</div>
      <h1>China Food Passport</h1>
      <p class="subtitle">Try it. Rate it. Photograph it. Remember it.</p>
      <div class="progress-wrap">
        <div class="progress-line"><span id="progressText">0 of 39 tried</span><strong id="progressPct">0%</strong></div>
        <div class="progress"><div id="progressBar"></div></div>
      </div>
      <div class="stats">
        <div class="stat"><b id="statTried">0</b><span>dishes tried</span></div>
        <div class="stat"><b id="statScore">—</b><span>average score</span></div>
        <div class="stat"><b>8</b><span>food stops</span></div>
      </div>
    </section>

    <div class="toolbar">
      <input id="search" class="search" type="search" placeholder="Search food or Chinese name…" aria-label="Search foods">
      <select id="filter" class="filter" aria-label="Filter dishes">
        <option value="all">All dishes</option>
        <option value="untried">Not tried</option>
        <option value="tried">Tried</option>
        <option value="rated9">9–10 rated</option>
      </select>
    </div>

    <nav class="cities" id="cities" aria-label="Filter by city"></nav>

    <div class="section-head">
      <h2 id="viewTitle">All foods</h2>
      <span id="viewCount"></span>
    </div>
    <section id="foodGrid" class="grid" aria-live="polite"></section>

    <div class="bottom-actions">
      <button id="exportBtn" type="button">Export backup</button>
      <label class="import-label">Import backup<input id="importInput" type="file" accept="application/json"></label>
      <button id="resetBtn" type="button">Reset trip data</button>
    </div>
  </main>

  <dialog id="descDialog">
    <div class="modal">
      <button class="close" id="closeDialog" aria-label="Close description">×</button>
      <h3 id="modalName"></h3>
      <div class="cn" id="modalCn"></div>
      <p id="modalDesc"></p>
      <div class="tip"><strong>Ordering tip</strong><br><span id="modalTip"></span></div>
    </div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const FOODS = [{"city": "Beijing", "name": "Peking duck", "cn": "北京烤鸭", "desc": "Roast duck with lacquered, crisp skin and tender meat, usually carved tableside and wrapped in thin pancakes with spring onion, cucumber and sweet bean sauce.", "tip": "Book one proper duck meal; for two people, half a duck is often enough."}, {"city": "Beijing", "name": "Zhajiangmian", "cn": "炸酱面", "desc": "Thick wheat noodles topped with a savoury fried soybean-and-pork sauce, then mixed with fresh shredded vegetables. It is one of Beijing's classic everyday noodle dishes.", "tip": "A great casual lunch; mix everything thoroughly before eating."}, {"city": "Beijing", "name": "Jianbing", "cn": "煎饼", "desc": "A hot savoury breakfast crepe cooked on a griddle with egg, herbs and sauce, usually folded around a crisp cracker for crunch.", "tip": "Best from a busy breakfast stall in the morning."}, {"city": "Beijing", "name": "Copper-pot mutton hotpot", "cn": "涮羊肉", "desc": "Paper-thin slices of lamb are quickly swished in a light broth inside a traditional copper pot, then dipped in a rich sesame-based sauce.", "tip": "Very different from Sichuan hotpot: lighter, lamb-focused and traditionally Beijing."}, {"city": "Beijing", "name": "Jiaozi dumplings", "cn": "饺子", "desc": "Boiled or steamed dumplings filled with combinations such as pork, chive, cabbage, lamb or vegetables, usually eaten with vinegar and garlic.", "tip": "Order several fillings to share."}, {"city": "Beijing", "name": "Douzhi", "cn": "豆汁", "desc": "A traditional fermented mung-bean drink with a strong sour, funky flavour. It is one of Beijing's most notorious local tastes and is often served with fried dough rings.", "tip": "Try a small serving for the experience; this is very much a love-it-or-hate-it food."}, {"city": "Xi'an", "name": "Biang Biang noodles", "cn": "油泼扯面 / Biángbiáng面", "desc": "Very wide, hand-pulled wheat noodles dressed with chilli, garlic, vinegar and hot oil. Chewy, aromatic and one of Shaanxi's signature dishes.", "tip": "One of the highest-priority foods on the whole trip."}, {"city": "Xi'an", "name": "Roujiamo", "cn": "肉夹馍", "desc": "A crisp, dense flatbread split and stuffed with finely chopped slow-braised meat. Often described as a Chinese hamburger, but with a much older history.", "tip": "Perfect as a snack while exploring the city."}, {"city": "Xi'an", "name": "Yangrou paomo", "cn": "羊肉泡馍", "desc": "A deeply savoury lamb or mutton broth served with small pieces of dense flatbread. Traditionally, diners tear the bread into tiny pieces before the kitchen adds the soup.", "tip": "Give yourself time for the bread-tearing ritual; it is part of the experience."}, {"city": "Xi'an", "name": "Liangpi", "cn": "凉皮", "desc": "Cool, springy wheat or rice noodles dressed with chilli oil, vinegar, garlic, sesame and often cucumber or bean sprouts.", "tip": "Especially good as a light lunch alongside roujiamo."}, {"city": "Xi'an", "name": "Local dumplings", "cn": "饺子 / 饺子宴", "desc": "Xi'an has a strong dumpling tradition, from simple boiled dumplings to elaborate dumpling banquets with many shapes and fillings.", "tip": "A dumpling banquet is fun, but a small local shop is often better value."}, {"city": "Xi'an", "name": "Persimmon cake", "cn": "柿子饼", "desc": "A sweet Shaanxi snack made from persimmon dough, often filled with ingredients such as nuts or sesame and pan-fried until soft and fragrant.", "tip": "Look for freshly cooked ones around the old city rather than packaged versions."}, {"city": "Chengdu", "name": "Sichuan hotpot", "cn": "四川火锅", "desc": "A bubbling communal pot flavoured with dried chillies, Sichuan peppercorns and aromatics. Ingredients are cooked at the table and dipped into a personal sauce.", "tip": "Choose a split pot or mild spice level if you want to enjoy more than just the heat."}, {"city": "Chengdu", "name": "Mapo tofu", "cn": "麻婆豆腐", "desc": "Silky tofu in a glossy sauce of minced meat, fermented bean paste, chilli and Sichuan pepper. A proper Chengdu version balances heat, salt, richness and numbing pepper.", "tip": "Eat it with plain rice so you can appreciate the sauce."}, {"city": "Chengdu", "name": "Dan Dan noodles", "cn": "担担面", "desc": "A small bowl of noodles tossed with chilli oil, Sichuan pepper, preserved vegetables, sesame or peanut notes and often minced pork.", "tip": "Usually a snack-sized portion, so it is easy to combine with other dishes."}, {"city": "Chengdu", "name": "Chuan Chuan", "cn": "串串香", "desc": "A huge selection of meats, tofu, mushrooms and vegetables served on skewers and cooked in a spicy communal broth.", "tip": "Pick a few unfamiliar skewers as well as safe favourites; you normally pay by counting sticks."}, {"city": "Chengdu", "name": "Zhong dumplings", "cn": "钟水饺", "desc": "Soft pork dumplings dressed in a glossy sauce that combines chilli oil, garlic and a slightly sweet seasoned soy sauce.", "tip": "A good choice at a traditional Chengdu snack restaurant."}, {"city": "Chengdu", "name": "Sweet-water noodles", "cn": "甜水面", "desc": "Thick, chewy noodles coated in a sweet-savoury-spicy sauce with sesame, chilli and aromatic soy flavours.", "tip": "The texture is the star; order a small bowl as part of a snack crawl."}, {"city": "Chengdu", "name": "Rabbit head", "cn": "兔头", "desc": "A famous Chengdu snack of rabbit head braised and coated in intense chilli and Sichuan pepper seasoning. Diners pick the meat carefully from around the bone.", "tip": "Definitely optional, but one of the city's most distinctive food experiences."}, {"city": "Chongqing", "name": "Chongqing hotpot", "cn": "重庆火锅", "desc": "An intense beef-tallow hotpot packed with dried chilli and Sichuan pepper. Compared with Chengdu hotpot, it is often heavier, punchier and more aggressively spicy.", "tip": "Do this even if you already had hotpot in Chengdu; the styles are noticeably different."}, {"city": "Chongqing", "name": "Xiaomian", "cn": "重庆小面", "desc": "Chongqing's everyday spicy noodles, usually seasoned with chilli oil, Sichuan pepper, garlic, preserved vegetables and sesame or peanuts.", "tip": "Excellent breakfast or quick lunch; busy neighbourhood noodle shops are ideal."}, {"city": "Chongqing", "name": "Suanlafen", "cn": "酸辣粉", "desc": "Springy sweet-potato noodles in a hot-and-sour broth with chilli, vinegar, peanuts and preserved vegetables.", "tip": "Great street-food option when you want something fast and punchy."}, {"city": "Chongqing", "name": "Grilled fish", "cn": "烤鱼", "desc": "A whole fish is grilled, then served in a sizzling tray with chillies, aromatics, vegetables and a rich sauce that keeps cooking at the table.", "tip": "Best shared between two or more people."}, {"city": "Chongqing", "name": "Laziji", "cn": "辣子鸡", "desc": "Small pieces of crisp fried chicken tossed with a mountain of dried chillies, Sichuan pepper and aromatics.", "tip": "You hunt through the chillies for the chicken; the dish is meant to be fragrant as well as hot."}, {"city": "Chongqing", "name": "Shaokao barbecue", "cn": "烧烤", "desc": "Late-night Chinese barbecue: skewers of meat, vegetables, tofu and other ingredients grilled over heat and heavily seasoned with chilli, cumin and spices.", "tip": "Best after dark with a few different skewers ordered to share."}, {"city": "Zhangjiajie", "name": "Tujia Sanxia Guo", "cn": "三下锅", "desc": "A hearty local Tujia pot containing a mixture of meats, tofu and vegetables cooked together with chilli and savoury seasonings.", "tip": "This is the signature Zhangjiajie dish to prioritise."}, {"city": "Zhangjiajie", "name": "Tujia smoked pork", "cn": "土家腊肉", "desc": "Pork that has been cured and smoked, giving it a salty, concentrated flavour. It is commonly stir-fried with vegetables or chillies.", "tip": "Good with rice after a long day in the national park."}, {"city": "Zhangjiajie", "name": "Hezha", "cn": "合渣", "desc": "A rustic Tujia dish made from ground soybeans cooked into a soft, comforting mixture, often with greens. It is mild compared with many dishes on this route.", "tip": "Useful as a break from spicy food."}, {"city": "Zhangjiajie", "name": "Sour fish / sour dishes", "cn": "酸鱼 / 酸味菜", "desc": "The wider Hunan and minority cuisines of the region make strong use of sour, pickled and fermented flavours, including fish and vegetable dishes.", "tip": "Ask the restaurant what sour speciality they make best that day."}, {"city": "Fenghuang", "name": "Blood duck", "cn": "血粑鸭", "desc": "Fenghuang's signature dish: duck cooked with chillies and pieces of blood rice cake, producing a rich, savoury and distinctly local Hunan-style dish.", "tip": "The English name sounds intimidating, but this is the food to try in Fenghuang."}, {"city": "Fenghuang", "name": "Miao sour fish / sour soup", "cn": "酸汤鱼", "desc": "Fish cooked in a tangy, spicy sour broth associated with Miao cuisine. The sourness typically comes from fermented or pickled ingredients.", "tip": "A good shared dinner beside the river."}, {"city": "Fenghuang", "name": "Smoked pork", "cn": "腊肉", "desc": "Cured and smoked pork is common across the Tujia and Miao areas, often stir-fried with local chillies, vegetables or preserved ingredients.", "tip": "Compare it with the smoked pork you try in Zhangjiajie."}, {"city": "Fenghuang", "name": "Rice tofu", "cn": "米豆腐", "desc": "A soft, slippery local snack made from rice rather than soy, usually cut into pieces and served with chilli, vinegar and savoury toppings.", "tip": "Good for a quick snack while wandering the old town."}, {"city": "Fenghuang", "name": "Ginger sweets", "cn": "姜糖", "desc": "Traditional chewy ginger candy made and stretched in shops around the ancient town, with a sweet, warming ginger flavour.", "tip": "Try a fresh sample before buying a bag."}, {"city": "Guilin", "name": "Guilin rice noodles", "cn": "桂林米粉", "desc": "The city's classic breakfast: rice noodles topped with braised meat, peanuts, pickled vegetables and a concentrated savoury sauce or broth.", "tip": "Eat them for breakfast at a busy local noodle shop."}, {"city": "Guilin", "name": "Gongcheng oil tea", "cn": "油茶", "desc": "A distinctive savoury tea soup made by pounding and frying tea leaves with ginger and other aromatics, then serving the brew with crunchy accompaniments.", "tip": "Unusual and slightly bitter; worth trying once for its strong local identity."}, {"city": "Guilin", "name": "Lipu taro pork", "cn": "荔浦芋扣肉", "desc": "Alternating slices of rich pork belly and fragrant Lipu taro are steamed together until soft, creating a sweet-savoury, deeply comforting dish.", "tip": "Best shared because it is quite rich."}, {"city": "Yangshuo", "name": "Beer fish", "cn": "啤酒鱼", "desc": "Yangshuo's signature dish: freshwater fish cooked with local beer, tomatoes, peppers, garlic and ginger until the sauce becomes rich and aromatic.", "tip": "Choose the fish carefully and confirm the price by weight before ordering."}, {"city": "Yangshuo", "name": "Stuffed river snails", "cn": "田螺酿", "desc": "River-snail shells filled with a seasoned mixture, commonly minced pork, snail meat and herbs, then cooked in a savoury sauce.", "tip": "A very local dish and a good one to share alongside beer fish."}];
const STORAGE_KEY = "china-food-passport-v1";
let state = loadState();
let activeCity = "All";
let photoDB = null;

function idForFood(f) {
  return (f.city + "::" + f.name).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function blankEntry() { return {tried:false, score:"", notes:""}; }
function loadState() {
  try {
    const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    return parsed && typeof parsed === "object" ? parsed : {};
  } catch { return {}; }
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  updateStats();
}
function entry(id) {
  if (!state[id]) state[id] = blankEntry();
  return state[id];
}
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(()=>t.classList.remove("show"),1800);
}

function openPhotoDB() {
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open("china-food-passport-photos",1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("photos")) db.createObjectStore("photos");
    };
    req.onsuccess = () => { photoDB = req.result; resolve(photoDB); };
    req.onerror = () => reject(req.error);
  });
}
function photoGet(id) {
  return new Promise((resolve,reject)=>{
    if (!photoDB) return resolve(null);
    const tx = photoDB.transaction("photos","readonly");
    const req = tx.objectStore("photos").get(id);
    req.onsuccess = ()=>resolve(req.result || null);
    req.onerror = ()=>reject(req.error);
  });
}
function photoPut(id, blob) {
  return new Promise((resolve,reject)=>{
    const tx = photoDB.transaction("photos","readwrite");
    tx.objectStore("photos").put(blob,id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
function photoDelete(id) {
  return new Promise((resolve,reject)=>{
    const tx = photoDB.transaction("photos","readwrite");
    tx.objectStore("photos").delete(id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
function fileToCompressedBlob(file) {
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const max = 1400;
        let w=img.width, h=img.height;
        const scale = Math.min(1, max/Math.max(w,h));
        w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        c.toBlob(b=>{ URL.revokeObjectURL(url); b ? resolve(b) : reject(new Error("Could not process photo")); }, "image/jpeg", .82);
      } catch(e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read image")); };
    img.src=url;
  });
}

const cityOrder = ["All","Beijing","Xi'an","Chengdu","Chongqing","Zhangjiajie","Fenghuang","Guilin","Yangshuo"];

function renderCities() {
  const wrap=document.getElementById("cities"); wrap.innerHTML="";
  cityOrder.forEach(city=>{
    const b=document.createElement("button");
    b.type="button"; b.className="chip"+(city===activeCity?" active":"");
    b.textContent=city;
    b.addEventListener("click",()=>{activeCity=city; renderCities(); render();});
    wrap.appendChild(b);
  });
}

function filteredFoods() {
  const q=document.getElementById("search").value.trim().toLowerCase();
  const filter=document.getElementById("filter").value;
  return FOODS.filter(f=>{
    const id=idForFood(f), e=entry(id);
    if (activeCity!=="All" && f.city!==activeCity) return false;
    if (q && !(f.name.toLowerCase().includes(q) || f.cn.toLowerCase().includes(q) || f.city.toLowerCase().includes(q))) return false;
    if (filter==="untried" && e.tried) return false;
    if (filter==="tried" && !e.tried) return false;
    if (filter==="rated9" && !(Number(e.score)>=9)) return false;
    return true;
  });
}

async function render() {
  const grid=document.getElementById("foodGrid");
  const items=filteredFoods();
  document.getElementById("viewTitle").textContent = activeCity==="All" ? "All foods" : activeCity;
  document.getElementById("viewCount").textContent = items.length + (items.length===1?" dish":" dishes");
  grid.innerHTML="";
  if(!items.length) {
    grid.innerHTML='<div class="empty">No dishes match this view.</div>';
    return;
  }
  for (const f of items) {
    const id=idForFood(f), e=entry(id);
    const card=document.createElement("article");
    card.className="card"+(e.tried?" tried":"");
    card.dataset.id=id;

    const main=document.createElement("div"); main.className="card-main";
    const photo=document.createElement("div"); photo.className="photo";
    photo.innerHTML='<div class="photo-placeholder">📷</div><small>Tap photo to add</small>';
    const currentPhoto = await photoGet(id).catch(()=>null);
    if(currentPhoto) {
      const img=document.createElement("img"); img.alt="Photo of "+f.name; img.src=URL.createObjectURL(currentPhoto);
      photo.appendChild(img);
      photo.querySelector("small").textContent="Tap to replace";
    }
    const fileInput=document.createElement("input");
    fileInput.type="file"; fileInput.accept="image/*"; fileInput.hidden=true;
    fileInput.addEventListener("change", async ()=>{
      const file=fileInput.files && fileInput.files[0];
      if(!file) return;
      try {
        const blob=await fileToCompressedBlob(file);
        await photoPut(id,blob);
        showToast("Photo saved");
        render();
      } catch { showToast("Could not save that photo"); }
    });
    photo.addEventListener("click",()=>fileInput.click());
    photo.appendChild(fileInput);

    const body=document.createElement("div"); body.className="body";
    const top=document.createElement("div"); top.className="toprow";
    const titleWrap=document.createElement("div");
    titleWrap.innerHTML='<div class="name"></div><div class="cn"></div>';
    titleWrap.querySelector(".name").textContent=f.name;
    titleWrap.querySelector(".cn").textContent=f.cn;
    const check=document.createElement("button"); check.type="button"; check.className="check"+(e.tried?" on":""); check.setAttribute("aria-label",(e.tried?"Mark not tried: ":"Mark tried: ")+f.name); check.textContent=e.tried?"✓":"";
    check.addEventListener("click",()=>{e.tried=!e.tried; state[id]=e; saveState(); render();});
    top.append(titleWrap,check);

    const controls=document.createElement("div"); controls.className="controls";
    const score=document.createElement("select"); score.className="score"; score.setAttribute("aria-label","Score "+f.name+" out of 10");
    score.innerHTML='<option value="">Score /10</option>'+Array.from({length:10},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'/10</option>').join("");
    score.value=e.score || "";
    score.addEventListener("change",()=>{e.score=score.value; if(score.value) e.tried=true; state[id]=e; saveState(); render();});

    const about=document.createElement("button"); about.type="button"; about.className="small-btn primary"; about.textContent="What is it?";
    about.addEventListener("click",()=>openDescription(f));

    const notesBtn=document.createElement("button"); notesBtn.type="button"; notesBtn.className="small-btn"; notesBtn.textContent=e.notes?"Edit notes":"Add notes";
    const notes=document.createElement("textarea"); notes.className="notes"; notes.placeholder="Where did you eat it? What did you think?";
    notes.value=e.notes || "";
    notesBtn.addEventListener("click",()=>{notes.classList.toggle("open"); if(notes.classList.contains("open")) notes.focus();});
    notes.addEventListener("change",()=>{e.notes=notes.value.trim(); state[id]=e; saveState(); notesBtn.textContent=e.notes?"Edit notes":"Add notes";});
    controls.append(score,about,notesBtn,notes);
    body.append(top,controls);
    main.append(photo,body);
    card.append(main);
    const foot=document.createElement("div"); foot.className="card-footer"; foot.innerHTML='<span class="city-tag"></span>';
    foot.querySelector(".city-tag").textContent=f.city;
    card.append(foot);
    grid.append(card);
  }
}

function openDescription(f) {
  document.getElementById("modalName").textContent=f.name;
  document.getElementById("modalCn").textContent=f.cn;
  document.getElementById("modalDesc").textContent=f.desc;
  document.getElementById("modalTip").textContent=f.tip;
  const dlg=document.getElementById("descDialog");
  if(typeof dlg.showModal==="function") dlg.showModal(); else dlg.setAttribute("open","");
}
function updateStats() {
  const ids=FOODS.map(idForFood);
  const entries=ids.map(id=>state[id]||blankEntry());
  const tried=entries.filter(e=>e.tried).length;
  const scores=entries.map(e=>Number(e.score)).filter(n=>Number.isFinite(n)&&n>0);
  const avg=scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : "—";
  const pct=Math.round(tried/FOODS.length*100);
  document.getElementById("progressText").textContent=tried+" of "+FOODS.length+" tried";
  document.getElementById("progressPct").textContent=pct+"%";
  document.getElementById("progressBar").style.width=pct+"%";
  document.getElementById("statTried").textContent=tried;
  document.getElementById("statScore").textContent=avg;
}

async function blobToDataURL(blob) {
  return new Promise((resolve,reject)=>{
    const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=()=>reject(r.error); r.readAsDataURL(blob);
  });
}
async function dataURLToBlob(dataURL) {
  const res=await fetch(dataURL); return await res.blob();
}
async function exportBackup() {
  const photos={};
  for (const f of FOODS) {
    const id=idForFood(f), blob=await photoGet(id).catch(()=>null);
    if(blob) photos[id]=await blobToDataURL(blob);
  }
  const payload={version:1, exportedAt:new Date().toISOString(), state, photos};
  const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="china-food-passport-backup.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  showToast("Backup exported");
}
async function importBackup(file) {
  try {
    const payload=JSON.parse(await file.text());
    if(!payload || typeof payload.state!=="object") throw new Error();
    state=payload.state; saveState();
    if(payload.photos && typeof payload.photos==="object") {
      for (const [id,data] of Object.entries(payload.photos)) {
        if(typeof data==="string" && data.startsWith("data:")) await photoPut(id,await dataURLToBlob(data));
      }
    }
    showToast("Backup imported");
    render();
  } catch { showToast("That backup file could not be imported"); }
}

document.getElementById("search").addEventListener("input",render);
document.getElementById("filter").addEventListener("change",render);
document.getElementById("closeDialog").addEventListener("click",()=>document.getElementById("descDialog").close());
document.getElementById("exportBtn").addEventListener("click",exportBackup);
document.getElementById("importInput").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0]; if(f) importBackup(f); e.target.value="";});
document.getElementById("resetBtn").addEventListener("click",async()=>{
  if(!confirm("Reset every checkbox, score, note and photo? This cannot be undone unless you exported a backup.")) return;
  state={}; localStorage.removeItem(STORAGE_KEY);
  if(photoDB) {
    await new Promise((resolve,reject)=>{const tx=photoDB.transaction("photos","readwrite"); tx.objectStore("photos").clear(); tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);});
  }
  updateStats(); render(); showToast("Trip data reset");
});

(async function init() {
  try { await openPhotoDB(); } catch { showToast("Photos may not persist in this browser"); }
  renderCities(); updateStats(); render();
  if("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  }
})();
</script>
</body>
</html>
